name: Build Impeller

run-name: Build Impeller ${{ inputs.ref }}

on:
  workflow_dispatch:
    inputs:
      ref:
        description: "avalonia/<flutter tag> branch, upstream release tag (3.50.0, 3.50.0-0.4.pre), or the SHA of either"
        required: true
      repository:
        description: "GitHub repository of the avalonia/* patch branches"
        required: true
        default: "AvaloniaUI/flutter"

permissions:
  contents: read

concurrency:
  group: build-${{ inputs.ref }}
  cancel-in-progress: false

env:
  PYTHONUNBUFFERED: "1"

jobs:
  resolve:
    name: Resolve ${{ inputs.ref }}
    runs-on: ubuntu-24.04
    outputs:
      repository: ${{ steps.version.outputs.repository }}
      ref: ${{ steps.version.outputs.ref }}
      sha: ${{ steps.version.outputs.sha }}
      version: ${{ steps.version.outputs.version }}
      kind: ${{ steps.version.outputs.kind }}
      patched: ${{ steps.version.outputs.patched }}
      tag: ${{ steps.version.outputs.tag }}
    steps:
      - uses: actions/checkout@v4

      - name: Resolve
        id: version
        env:
          REF: ${{ inputs.ref }}
          REPOSITORY: ${{ inputs.repository }}
        run: python3 scripts/fetch-flutter.py --repository "$REPOSITORY" --ref "$REF" --resolve-only --github-output

      - name: Check that the release does not exist
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ steps.version.outputs.tag }}
        run: |
          if gh release view "$TAG" --repo "$GITHUB_REPOSITORY" > /dev/null 2>&1; then
            echo "::error::Release $TAG already exists"
            exit 1
          fi

  build:
    name: ${{ matrix.rid }}
    needs: resolve
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 360
    strategy:
      fail-fast: false
      matrix:
        include:
          - { rid: linux-x64, runner: ubuntu-24.04 }
          - { rid: linux-arm64, runner: ubuntu-24.04-arm }
          - { rid: android-arm64, runner: ubuntu-24.04 }
          - { rid: android-arm, runner: ubuntu-24.04 }
          - { rid: android-x64, runner: ubuntu-24.04 }
          - { rid: osx-arm64, runner: macos-15 }
          - { rid: osx-x64, runner: macos-15 }
          - { rid: win-x64, runner: windows-2022 }
          - { rid: win-arm64, runner: windows-2022 }
    env:
      RID: ${{ matrix.rid }}
      TAG: ${{ needs.resolve.outputs.tag }}
    steps:
      - name: Free disk space (Linux)
        if: runner.os == 'Linux'
        run: |
          df -h /
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /usr/local/.ghcup /usr/share/swift \
            /usr/local/share/powershell /usr/lib/jvm /opt/hostedtoolcache/CodeQL /usr/local/share/chromium || true
          sudo docker image prune --all --force > /dev/null 2>&1 || true
          df -h /

      - name: Free disk space (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          Get-PSDrive C, D -ErrorAction SilentlyContinue | Format-Table Name, @{n='FreeGB';e={[int]($_.Free/1GB)}}
          Remove-Item -Recurse -Force -ErrorAction SilentlyContinue `
            "$env:ProgramFiles\dotnet", "$env:ANDROID_HOME", "C:\Android", "C:\hostedtoolcache\windows\CodeQL", `
            "C:\Program Files\Microsoft SQL Server", "C:\ghcup", "C:\Strawberry"
          Get-PSDrive C, D -ErrorAction SilentlyContinue | Format-Table Name, @{n='FreeGB';e={[int]($_.Free/1GB)}}

      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Resolved version
        shell: bash
        env:
          RESOLVED: ${{ toJSON(needs.resolve.outputs) }}
        run: |
          mkdir -p release
          python3 -c 'import json, os; d = json.loads(os.environ["RESOLVED"]); d["patched"] = d["patched"] == "true"; open("release/resolved.json", "w").write(json.dumps(d, indent=2))'
          cat release/resolved.json

      - name: Fetch Flutter
        shell: bash
        run: >
          python scripts/fetch-flutter.py --repository "${{ needs.resolve.outputs.repository }}"
          --sha "${{ needs.resolve.outputs.sha }}" --rid "$RID"

      - name: Build
        shell: bash
        run: python scripts/build.py "$RID" --tag "$TAG" --resolved release/resolved.json

      - name: Disk use
        if: always()
        shell: bash
        run: df -h . || true

      - uses: actions/upload-artifact@v4
        with:
          name: impeller-${{ matrix.rid }}
          path: release/*.tar.gz
          if-no-files-found: error
          compression-level: 0

  release:
    name: Release
    needs: [resolve, build]
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - uses: actions/download-artifact@v4
        with:
          pattern: impeller-*
          path: release
          merge-multiple: true

      - name: Checksums and manifest
        env:
          OUT: ${{ toJSON(needs.resolve.outputs) }}
        run: |
          python3 -c 'import json, os; d = json.loads(os.environ["OUT"]); d["patched"] = d["patched"] == "true"; open("resolved.json", "w").write(json.dumps(d, indent=2))'
          python3 scripts/make-release.py release --tag "${{ needs.resolve.outputs.tag }}" --resolved resolved.json

      - name: Publish
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ needs.resolve.outputs.tag }}
        run: >
          gh release create "$TAG" release/*.tar.gz release/SHA256SUMS release/manifest.json
          --repo "$GITHUB_REPOSITORY" --target "$GITHUB_SHA" --title "Impeller $TAG"
          --notes-file release/release-notes.md
